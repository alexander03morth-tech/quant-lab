# OMXS30-universum för Quant Lab.
# Källa: Nasdaq OMXS30-sammansättning efter halvårsöversynen 1 juni 2026 (inga ändringar).
# Nästa översyn: december 2026. Ändra listan här – pipelinen och webben läser allt härifrån.
#
# OBS survivorship bias: listan används bakåt i tiden. Bolag som lämnat indexet
# (eller gått i konkurs) saknas, vilket gör historiska resultat bättre än verkligheten.

as_of: "2026-06-01"
start_date: "2010-01-01"   # minst 10 år; vi tar mer där det finns

benchmark:
  ticker: "^OMX"
  name: "OMX Stockholm 30"

sectors:
  industri: "Industri"
  finans: "Finans"
  halsovard: "Hälsovård"
  material: "Råvaror & material"
  it: "Informationsteknik"
  sallanskop: "Sällanköpsvaror"
  dagligvaror: "Dagligvaror"
  telekom: "Telekom & kommunikation"

# news: Google News-sökning (svenska). Exkludera namnkrockar, t.ex. Volvo Cars ≠ AB Volvo.
stocks:
  - { ticker: ABB.ST,      name: ABB,               sector: industri, news: '"ABB" (aktie OR koncernen OR order OR rapport)' }
  - { ticker: ADDT-B.ST,   name: Addtech B,         sector: industri, news: '"Addtech"' }
